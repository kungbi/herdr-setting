onboarding = false
[theme]
name = "dracula"
auto_switch = false

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[keys]
goto = ""
next_agent = ""
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "agent-picker.open"
description = "Select agent"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "Toggle code review"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "Annotate selected terminal text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "Copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "Copy and archive annotations"

[[keys.command]]
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"
description = "Paste annotations without sending and archive"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "annotate.send-archive"
description = "Send annotations to agent and archive"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "Manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "Review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "Review agent replies"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "Review newest agent reply"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "Open plugin manager"

[[keys.command]]
key = "prefix+ctrl+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "Toggle Neovim sidebar"

[[keys.command]]
key = "prefix+ctrl+f"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "Find file for Neovim sidebar"
